name: Sync published story social previews

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-blog-story-previews
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync published story metadata
        run: node scripts/sync-blog-stories.mjs
      - name: Commit updated story pages
        run: |
          if git diff --quiet -- stories; then
            echo "No story metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories
          git commit -m "Sync published story social preview metadata"
          git push origin HEAD:main
